version: "3.9"

services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/friend-orbit.db
      - CHROMA_PATH=/app/data/chroma
      - CONTENT_PACK_PATH=/app/content_pack
    volumes:
      - ./data:/app/data
      - ./content_pack:/app/content_pack
      - ./uploads:/app/uploads
    ports:
      - "8001:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    ports:
      - "3001:3000"
    depends_on:
      - api
